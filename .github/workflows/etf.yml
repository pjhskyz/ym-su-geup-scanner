name: ETF sector monitor

on:
  schedule:
    - cron: '15 22 * * *'   # 07:15 KST, completed US session + latest KR session
    - cron: '35 11 * * 1-5' # 20:35 KST, completed KR session
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build_etf_data.py'
      - 'test_etf_data.py'
      - 'build_holdings_data.py'
      - 'test_holdings*.py'
      - 'holdings_pipeline/**/*.py'
      - 'holdings_pipeline/active_universe.json'
      - 'etf_pipeline/**'
      - '!etf_pipeline/kr_catalog.json'
      - '.github/workflows/etf.yml'

permissions:
  contents: write

concurrency:
  group: etf-sector-monitor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install trading calendar
        run: pip install 'exchange_calendars==4.13.2'
      - name: Restore independent price history
        uses: actions/cache@v4
        with:
          path: |
            etf_pipeline/data/series
            etf_pipeline/data/issuer_quotes
            etf_pipeline/output
          key: etf-prices-v1-${{ github.run_id }}
          restore-keys: etf-prices-v1-
      - name: Validate calculation rules
        run: python -m unittest test_etf_data test_holdings_data test_holdings_naver test_holdings_issuers test_holdings_integration test_holdings_aum
      - name: Validate holdings amounts and sorting
        run: node --test holdings_logic.test.js
      - name: Refresh Korea ETF discovery catalog
        continue-on-error: true
        run: python -u etf_pipeline/collect_kr_catalog.py --output etf_pipeline/kr_catalog.json --universe etf_pipeline/universe.json
      - name: Collect completed sessions and calculate ETF signals
        run: python -u build_etf_data.py --output etf_data.json
      - name: Collect dated ETF holdings and compare constituents
        run: python -u build_holdings_data.py --output holdings_data.json
      - name: Publish ETF prices, holdings and dated history
        run: |
          python -c "import json; d=json.load(open('etf_data.json')); assert d['schema_version'] and d['expected_dates'] and isinstance(d['rows'],list)"
          python -c "import json; d=json.load(open('holdings_data.json')); assert d['schema_version']=='etf-holdings-v1' and d['expected_date'] and len(d['funds'])==d['coverage']['registered']"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          etf_generated_dir=$(mktemp -d "$RUNNER_TEMP/etf-data.XXXXXX")
          cp etf_data.json "$etf_generated_dir/etf_data.json"
          cp etf_pipeline/kr_catalog.json "$etf_generated_dir/kr_catalog.json"
          cp holdings_data.json "$etf_generated_dir/holdings_data.json"
          cp -R holdings_pipeline/history "$etf_generated_dir/holdings_history"
          cp -R holdings_pipeline/aum_history "$etf_generated_dir/aum_history"
          for attempt in 1 2 3 4 5; do
            git add etf_data.json etf_pipeline/kr_catalog.json holdings_data.json holdings_pipeline/history holdings_pipeline/aum_history
            if git diff --staged --quiet; then exit 0; fi
            git commit -m 'data: refresh ETF sector signals'
            if git push; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            cp "$etf_generated_dir/etf_data.json" etf_data.json
            cp "$etf_generated_dir/kr_catalog.json" etf_pipeline/kr_catalog.json
            cp "$etf_generated_dir/holdings_data.json" holdings_data.json
            cp -R "$etf_generated_dir/holdings_history/." holdings_pipeline/history/
            mkdir -p holdings_pipeline/aum_history
            cp -R "$etf_generated_dir/aum_history/." holdings_pipeline/aum_history/
          done
          exit 1
