name: ETF sector monitor

on:
  schedule:
    - cron: '15 22 * * *'   # 07:15 KST, completed US session + latest KR session
    - cron: '35 11 * * 1-5' # 20:35 KST, completed KR session
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build_etf_data.py'
      - 'test_etf_data.py'
      - 'etf_pipeline/**'
      - '.github/workflows/etf.yml'

permissions:
  contents: write

concurrency:
  group: etf-sector-monitor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install trading calendar
        run: pip install 'exchange_calendars==4.13.2'
      - name: Restore independent price history
        uses: actions/cache@v4
        with:
          path: |
            etf_pipeline/data/series
            etf_pipeline/data/issuer_quotes
            etf_pipeline/output
          key: etf-prices-v1-${{ github.run_id }}
          restore-keys: etf-prices-v1-
      - name: Validate calculation rules
        run: python -m unittest test_etf_data
      - name: Collect completed sessions and calculate ETF signals
        run: python -u build_etf_data.py --output etf_data.json
      - name: Publish ETF data only
        run: |
          python -c "import json; d=json.load(open('etf_data.json')); assert d['schema_version'] and d['expected_dates'] and isinstance(d['rows'],list)"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          etf_generated_dir=$(mktemp -d "$RUNNER_TEMP/etf-data.XXXXXX")
          cp etf_data.json "$etf_generated_dir/etf_data.json"
          for attempt in 1 2 3 4 5; do
            git add etf_data.json
            if git diff --staged --quiet; then exit 0; fi
            git commit -m 'data: refresh ETF sector signals'
            if git push; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            cp "$etf_generated_dir/etf_data.json" etf_data.json
          done
          exit 1
